[project]
name = "reinforce"
version = "0.1.0"
description = "Reinforcement learning research: algorithm reproduction and batched JAX environments"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Yuri Nakayama" }]
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "psutil>=6.0",
    "dvc[s3]>=3.50",
    # RL core. JAX is the default framework; torch is opt-in via the `nn` group.
    "gymnasium>=1.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "optax>=0.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]
# PyTorch, for cases that use it instead of JAX.
#   uv sync --group nn
# CPU wheels resolve from PyPI on every platform. For a CUDA build on a pod,
# see the torch-cu124 index recipe kept in docs/develop/reference/simulator/
# README.md (carried over from ptcg) — it pins cuDNN and conflicts with the
# `cuda` group below, so it is deliberately not wired in by default.
nn = [
    "torch>=2.4",
]
# GPU providers. Not needed for local CPU runs; install with
#   uv sync --group gpu
gpu = [
    "runpod>=1.7",
    "vastai>=0.3.0",
    "kaggle>=1.6",
]
# JAX CUDA 12 plugin for GPU pods (Linux x86_64 only — no macOS wheels).
#   uv sync --group cuda
# jax-cuda12-plugin expects cuDNN 9.8 while common pod images ship 9.1; the
# nvidia-cudnn-cu12 pin makes the plugin self-contained. Never
# `uv pip install --reinstall jax[cuda12]` at runtime after jax is imported —
# it invalidates loaded shared-library handles (SIGABRT).
cuda = [
    "jax-cuda12-plugin; sys_platform == 'linux'",
    "jax-cuda12-pjrt; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.8,<9.9; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each src/ subdirectory is exposed as a top-level package, so imports are
# bare: `from simulate.jaxenv import ...`, `from gpu.common import ...`.
packages = [
    "src/gpu",
    "src/simulate",
    "pipeline",
]

[tool.ruff]
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
    ".claude",
    "notebook",
]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# typer's API *requires* typer.Option()/Argument() calls in argument defaults;
# B008 ("no function call in default") does not apply to CLI entrypoints.
"**/__main__.py" = ["B008"]
"**/cli/app.py" = ["B008", "E501"]
"src/gpu/vast/cli.py" = ["B008", "E501"]
"src/gpu/kaggle/__init__.py" = ["E501"]
# These modules embed generated notebook / shell source as string literals.
# Rewrapping a line here changes the code that actually runs on the pod, so
# the line-length rule is waived rather than "fixed".
"**/interactive/template.py" = ["E501"]
"**/kernel/template.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
exclude = [
    ".venv",
    ".github",
    ".claude",
    "__pycache__",
    "notebook",
]
python_version = "3.13"
strict = true
disallow_any_decorated = false
disallow_any_unimported = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    '--rootdir=tests',
    '--strict-config',
    '--cov=src',
    '--log-cli-level=INFO',
    '-p no:cacheprovider',
    '-n=auto',
    '--dist=worksteal',
    '-ra',
]
testpaths = ['tests']
cache_dir = "tests/.pytest_cache"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (multi-update training runs, large batches)",
    "e2e: marks tests that run a full training loop or a real environment episode",
    "timeout: marks tests with an execution timeout",
]

[tool.coverage.run]
branch = true
omit = ["**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "if __name__ == .__main__.",
]
